
project:
  title: " "
  type: default
  resources:
    - styles/
    - assets/

# ----------------------------------------------------------
# Default profile: HTML-first infographic briefs
# ----------------------------------------------------------
format:
  html:
    theme: styles/report-html.scss
    title-block-style: none
    css:
      - styles/fontawesome/css/all.min.css
    output-dir: _output/html
    toc: false
    page-layout: full
    smooth-scroll: true
    embed-resources: true
    html-table-processing: none
    margin-left: -0.15in
    margin-right: -0.25in
    margin-top: -0.25in
    margin-bottom: -0.25in
    include-before-body:
      - text: |
          <div style="
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            width: 100%;
            padding: 10px 0 16px;
            break-inside: avoid;
          ">
          
            <div style="flex: 1; min-width: 0; text-align: center;">
              <img
                src="images/Mercy.png"
                style="max-width: 100%; max-height: 60px; width: auto; height: auto;"
                alt="Mercy"
              >
            </div>

            <div style="
              flex: 1.4;
              min-width: 0;
              text-align: center;
              border-left: 1px solid #999;
              padding-left: 12px;
            ">
              <img
                src="images/BHN Logo Vector.png"
                style="max-width: 100%; max-height: 60px; width: auto; height: auto;"
                alt="Behavioral Health Network of Greater St. Louis"
              >
            </div>

            <div style="
              flex: 0.6;
              min-width: 0;
              text-align: center;
              border-left: 1px solid #999;
              padding-left: 12px;
            ">
              <img
                src="images/pfp_logo.png"
                style="max-width: 100%; max-height: 60px; width: auto; height: auto;"
                alt="Places for People"
              >
            </div>

            <div style="flex: 1.2; min-width: 0; text-align: center;">
              <img
                src="images/Centerstone-logo.png"
                style="max-width: 100%; max-height: 60px; width: auto; height: auto;"
                alt="Centerstone"
              >
            </div>
          </div>
          
  pdf:
    pdf-engine: pagedjs-cli
    output-dir: _output/pdf

# ----------------------------------------------------------
# Additional profiles for narrative LaTeX reports
# ----------------------------------------------------------
profiles:
  latex:
    format:
      pdf:
        documentclass: article
        geometry: "margin=0.75in"
        keep-tex: false
        output-dir: _output/pdf
        toc: false
        number-sections: false
        include-in-header: styles/latex-preamble.tex

params:
  program: "complex-care"
  start_date: "2026-01-01"
  end_date: "2026-03-31"
  fiscal_system: "state"

execute:
  echo: false
  warning: false
  message: false
  include: false

extensions:
  - shafayetShafee/bsicons
#  - filter/your-filter.lua (placeholder in case a filter is added)

